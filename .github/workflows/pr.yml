name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: permalink-history
      dev-plugin-name: Permalink History - DEV
      build-command: npm ci && npm run build
      # Requires PHP 8.0: constructor promotion and union types do not parse on 7.4
      php-versions: '["8.0", "8.2", "8.3", "8.4"]'
      required-files: |
        vendor/autoload.php
        dist/gutenberg.ts.js
        dist/gutenberg.ts.asset.php
        languages/permalink-history.pot
        languages/permalink-history-de_DE.mo

  lint:
    name: ESLint & tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm ci

      - run: npm run lint

  # The branch ruleset requires this check by name - do not rename it. It fails if a
  # required job failed or was cancelled and is skipped otherwise, which the ruleset
  # treats as success. See https://github.com/actions/runner/issues/2566#issuecomment-3053484216
  mergeable:
    name: "Failure check"
    runs-on: ubuntu-latest
    needs:
      - checks
      - lint
    if: ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - run: |
          echo "::error::Some required job has failed!"
          exit 1
